version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: gemihub-desktop
  BIN_DIR: bin

tasks:
  build:
    cmds:
      - task: '{{OS}}:build'
  package:
    cmds:
      - task: '{{OS}}:package'
  run:
    cmds:
      - task: '{{OS}}:run'
