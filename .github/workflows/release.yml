name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version tag
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          wails_version=$(node -p "require('./wails.json').info.version")
          windows_version=$(node -p "require('./build/windows/info.json').fixed.file_version")
          manifest_version=$(sed -n 's/.*assemblyIdentity.*version="\([0-9.]*\)".*/\1/p' build/windows/wails.exe.manifest | head -n 1)
          if [ "$version" != "$wails_version" ] || [ "$version" != "$windows_version" ] || [ "${version}.0" != "$manifest_version" ]; then
            echo "Release versions are inconsistent: package=$version wails=$wails_version windows=$windows_version manifest=$manifest_version" >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: amd64
            artifact: gemihub-desktop-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            artifact: gemihub-desktop-linux-arm64
          - os: macos-14
            target: darwin
            arch: arm64
            artifact: gemihub-desktop-darwin-arm64
          - os: windows-latest
            target: windows
            arch: amd64
            artifact: gemihub-desktop-windows-amd64.exe
          - os: windows-latest
            target: windows
            arch: arm64
            artifact: gemihub-desktop-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.0

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check frontend
        run: deno task check

      - name: Test frontend
        run: deno task test

      # main.go embeds dist at compile time, so a clean checkout must produce
      # the frontend assets before any Go package can be compiled or tested.
      - name: Build frontend assets
        run: deno task build

      - name: Test backend
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            go test -tags gtk3 -count=1 ./...
          else
            go test -count=1 ./...
          fi

      - name: Build binary and Windows Store package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          else
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          fi
          wails3 task ${{ matrix.target }}:build ARCH=${{ matrix.arch }}
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp bin/gemihub-desktop.exe bin/${{ matrix.artifact }}
            wails3 task windows:msix ARCH=${{ matrix.arch }}
          else
            cp bin/gemihub-desktop bin/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/${{ matrix.artifact }}
            bin/gemihub-desktop-windows-*.msix
          if-no-files-found: error

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            dist/*
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
