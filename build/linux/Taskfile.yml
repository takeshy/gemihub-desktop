version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps: [common:tidy, common:frontend]
    cmds:
      - go build -tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s" -o {{.BIN_DIR}}/{{.APP_NAME}}
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
  package:
    cmds:
      - task: build
  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
